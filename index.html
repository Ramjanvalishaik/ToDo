<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — To-Do List</title>
  <meta name="description" content="A clean, minimal to-do list app with smooth transitions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <h1>My Tasks</h1>
      <span class="date-label" id="date-label"></span>
    </header>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-num" id="stat-all">0</span>
        <span class="stat-lbl">All</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="stat-active">0</span>
        <span class="stat-lbl">Active</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-num" id="stat-done">0</span>
        <span class="stat-lbl">Done</span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-row">
      <input
        type="text"
        id="task-input"
        placeholder="Add a new task…"
        autocomplete="off"
        maxlength="120"
      />
      <button id="add-btn">Add</button>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs" role="tablist">
      <button class="tab active" data-filter="all"       role="tab" aria-selected="true">All</button>
      <button class="tab"        data-filter="active"    role="tab" aria-selected="false">Active</button>
      <button class="tab"        data-filter="completed" role="tab" aria-selected="false">Done</button>
    </div>

    <!-- Task list -->
    <main class="task-section">
      <ul id="tasks-list" aria-label="Task list"></ul>

      <div class="empty-state" id="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M9 9h6M9 12h6M9 15h4"/>
        </svg>
        <p>No tasks here</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span id="footer-text" class="footer-text"></span>
      <button id="clear-completed-btn" class="clear-btn" style="display:none;">Clear done</button>
    </footer>

  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="script1.js"></script>
</body>
</html>
